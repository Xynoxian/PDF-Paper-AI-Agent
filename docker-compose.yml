  # PDF-Papers AI Agent — Docker Compose
# ======================================
# Services: MongoDB, Qdrant, Neo4j (+ APOC), FastAPI app
#
# Usage:
#   docker-compose up -d          # start all services
#   docker-compose up -d --build  # rebuild app image
#   docker-compose down -v        # stop and remove volumes

version: "3.9"

services:
  # ---------- MongoDB ----------
  mongodb:
    image: mongo:latest
    container_name: rag-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - ragnet
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- Qdrant ----------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ragnet

  # ---------- Neo4j ----------
  neo4j:
    image: neo4j:latest
    container_name: rag-neo4j
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: apoc.*
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - ragnet
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---------- FastAPI App ----------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rag-app
    ports:
      - "8001:8000"
    environment:
      MONGO_URI: mongodb://mongodb:27017
      MONGO_DB: pdf_rag
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
    volumes:
      - ./papers:/app/papers
    depends_on:
      mongodb:
        condition: service_healthy
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy
    networks:
      - ragnet

networks:
  ragnet:
    driver: bridge

volumes:
  mongo_data:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
